name: ZTAPI edge diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    environment: production
    runs-on: [self-hosted, ztapi-local]
    timeout-minutes: 10
    steps:
      - name: Configure deployment SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ZTAPI_DEPLOY_SSH_KEY }}

      - name: Verify server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 60 -t ed25519 123.254.104.157 > ~/.ssh/ztapi_known_hosts
          ssh-keygen -lf ~/.ssh/ztapi_known_hosts |
            grep 'SHA256:gz3lHpV1JPP65SRRGQjRv76qlMA3xsoHGZ1ak9n979g'

      - name: Inspect edge networking
        run: |
          set -euo pipefail
          ssh \
            -o UserKnownHostsFile="$HOME/.ssh/ztapi_known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=60 \
            ztapi-deploy@123.254.104.157 "sudo -n bash -s" <<'REMOTE'
          set -u
          echo '=== compose ==='
          cd /opt/ztapi
          docker compose \
            --env-file .env \
            -f deploy/docker/docker-compose.prod.yml \
            ps
          echo '=== listeners ==='
          ss -lntp
          echo '=== forwarding ==='
          sysctl net.ipv4.ip_forward
          echo '=== ufw ==='
          ufw status verbose || true
          echo '=== iptables input ==='
          iptables -S INPUT || true
          echo '=== iptables forward ==='
          iptables -S FORWARD || true
          echo '=== docker user ==='
          iptables -S DOCKER-USER || true
          echo '=== docker nat ==='
          iptables -t nat -S DOCKER || true
          echo '=== local status ==='
          curl --fail --silent --show-error \
            --resolve ztapi.vip:443:127.0.0.1 \
            https://ztapi.vip/api/status
          echo
          echo '=== preserved image-edit rejection ==='
          for response_file in /tmp/ztapi-image-edit-body.*; do
            test -f "$response_file" || continue
            printf 'file=%s\n' "$(basename "$response_file")"
            jq -c '{error:{message:.error.message,type:.error.type,code:.error.code}}' "$response_file"
          done
          REMOTE
