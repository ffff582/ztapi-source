name: Workbench macOS sandbox assessment

on:
  push:
    branches: ['qa/workbench-macos-sandbox']
    paths:
      - '.github/workflows/workbench-macos-sandbox-qa.yml'
      - 'tests/qa/macos-sandbox-*'

permissions:
  contents: read

jobs:
  kernel-fixture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - name: Verify sandbox with synthetic data only
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node --test tests/qa/macos-sandbox-policy.test.mjs
          node tests/qa/macos-sandbox-runtime.mjs "$EXPECTED_ARCH"
      - name: Read fixture-only kernel diagnostics
        if: failure()
        run: |
          /usr/bin/log show --last 2m --style compact --predicate 'eventMessage CONTAINS "workbench-sandbox-fixture"' | tail -60
          shopt -s nullglob
          reports=("$HOME"/Library/Logs/DiagnosticReports/workbench-sandbox-fixture-*.ips "$HOME"/Library/Logs/DiagnosticReports/.workbench-sandbox-fixture-*.ips)
          for report in "${reports[@]}"; do
            jq -cs 'last | {exception, termination, asi, frames: ((.threads[.faultingThread // 0].frames // [])[0:8] | map(.symbol))}' "$report"
          done
      - name: Assess App Sandbox for a zero-network test runner
        if: always() && !cancelled()
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node tests/qa/macos-sandbox-runtime.mjs "$EXPECTED_ARCH" app-sandbox
      - name: Run Node project fixture in the inherited App Sandbox
        if: always() && !cancelled()
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node tests/qa/macos-sandbox-runtime.mjs "$EXPECTED_ARCH" app-sandbox-node
