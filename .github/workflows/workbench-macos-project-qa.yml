name: Workbench macOS project broker assessment

on:
  push:
    branches: ['qa/workbench-macos-sandbox']
    paths:
      - '.github/workflows/workbench-macos-project-qa.yml'
      - 'desktop/macos/**'
      - 'tests/qa/darwin-project-*'

permissions:
  contents: read

jobs:
  broker:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - run: node --test tests/qa/darwin-project-broker.test.mjs tests/qa/darwin-project-review.test.mjs tests/qa/darwin-project-test-input.test.mjs
      - name: Run native project flow with the sandboxed test bundle
        run: node tests/qa/darwin-project-flow.mjs
      - run: node --test tests/qa/darwin-engine-pipe.test.mjs tests/qa/darwin-engine-transport.test.mjs
      - name: Verify local IPC from a separate sandboxed engine fixture
        run: node tests/qa/darwin-engine-ipc.mjs
