name: Workbench macOS DMG packaging assessment

on:
  push:
    branches: ['qa/workbench-macos-sandbox']
    paths:
      - '.github/workflows/workbench-macos-dmg-qa.yml'
      - 'desktop/macos/**'
      - 'tests/qa/darwin-packaging-fixture/**'

permissions:
  contents: read

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            engine: opencode-darwin-arm64.zip
          - runner: macos-15-intel
            arch: x64
            engine: opencode-darwin-x64-baseline.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - name: Build a synthetic installer with the production packager
        env:
          ARCH: ${{ matrix.arch }}
          ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -fsSL --max-time 120 \
            "https://github.com/electron/electron/releases/download/v45.2.3/electron-v45.2.3-darwin-$ARCH.zip" -o "$RUNNER_TEMP/electron.zip"
          curl --proto '=https' --proto-redir '=https' -fsSL --max-time 75 \
            "https://github.com/anomalyco/opencode/releases/download/v1.19.6/$ENGINE" -o "$RUNNER_TEMP/engine.zip"
          bash desktop/macos/build-dmg.sh tests/qa/darwin-packaging-fixture \
            "$RUNNER_TEMP/electron.zip" "$RUNNER_TEMP/engine.zip" "$(command -v node)" "$RUNNER_TEMP/ztapi-dmg"
      - name: Mount, copy and launch the synthetic desktop package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/ztapi-dmg"
          volume="$RUNNER_TEMP/ztapi-volume"
          mkdir "$volume" "$RUNNER_TEMP/ztapi-install"
          (cd "$build" && shasum -a 256 -c "ZTAPI-Workbench-macOS-$ARCH.dmg.sha256")
          hdiutil attach -quiet -readonly -nobrowse -mountpoint "$volume" "$build/ZTAPI-Workbench-macOS-$ARCH.dmg"
          trap 'hdiutil detach -quiet "$volume"' EXIT
          target="$RUNNER_TEMP/ztapi-install/ZTAPI Workbench Beta.app"
          ditto "$volume/ZTAPI Workbench Beta.app" "$target"
          codesign --verify --deep --strict "$target"
          node --input-type=module - "$target" <<'EOF'
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          import { join } from 'node:path';
          const binary = join(process.argv[2], 'Contents/MacOS/Electron');
          const result = execFileSync(binary, [], { timeout: 60000, encoding: 'utf8' });
          assert.match(result, /ZTAPI_DMG_DESKTOP_FIXTURE_OK/);
          console.log(result.trim());
          EOF
