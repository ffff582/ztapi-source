name: Workbench macOS installed-client assessment

on:
  push:
    branches: ['qa/workbench-macos-sandbox']
    paths:
      - '.github/workflows/workbench-macos-installed-client-qa.yml'
      - 'desktop/macos/assemble-published-client.mjs'
      - 'desktop/macos/desktop-client-*'
      - 'tests/qa/darwin-client-assembly.test.mjs'
      - 'tests/qa/darwin-installed-client.mjs'

permissions:
  contents: read

concurrency:
  group: workbench-macos-installed-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            engine: opencode-darwin-arm64.zip
          - runner: macos-15-intel
            arch: x64
            engine: opencode-darwin-x64-baseline.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    env:
      ARCH: ${{ matrix.arch }}
      ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - run: node --test tests/qa/darwin-client-assembly.test.mjs
      - name: Verify and reconstruct only the already-published desktop payload
        run: |
          set -euo pipefail
          sha=d29cbac1f3c245b7f1a928ca44ae557def6bdeabd9e8250bb38a02b9537bedce
          file="$RUNNER_TEMP/windows.exe"
          curl --proto '=https' -fsS --max-time 150 --max-filesize 255602652 \
            "https://ztapi.vip/client/artifacts/windows/$sha/ZTAPI-Workbench-rc29-opencode-13f76edb.exe" -o "$file"
          printf '%s  %s\n' "$sha" "$file" | shasum -a 256 -c -
          if ! command -v 7zz >/dev/null && ! command -v 7z >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install sevenzip
          fi
          archiver=$(command -v 7zz || command -v 7z)
          "$archiver" x -tNsis -y "-o$RUNNER_TEMP/public-readback" "$file" \
            'MANIFEST.json' 'app/desktop/*' 'app/src/*' >"$RUNNER_TEMP/archiver.log"
          node desktop/macos/assemble-published-client.mjs "$RUNNER_TEMP/public-readback" "$RUNNER_TEMP/real-app"
          ditto tests/qa/darwin-packaging-fixture/notices "$RUNNER_TEMP/real-app/notices"
      - name: Build the installed-client candidate without release publication
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -fsSL --max-time 120 \
            "https://github.com/electron/electron/releases/download/v45.2.3/electron-v45.2.3-darwin-$ARCH.zip" -o "$RUNNER_TEMP/electron.zip"
          curl --proto '=https' --proto-redir '=https' -fsSL --max-time 75 \
            "https://github.com/anomalyco/opencode/releases/download/v1.19.6/$ENGINE" -o "$RUNNER_TEMP/engine.zip"
          bash desktop/macos/build-dmg.sh "$RUNNER_TEMP/real-app" \
            "$RUNNER_TEMP/electron.zip" "$RUNNER_TEMP/engine.zip" "$(command -v node)" "$RUNNER_TEMP/ztapi-dmg"
      - name: Run the installed client against local synthetic account and billing receipts
        run: |
          set -euo pipefail
          curl --proto '=https' -fsS --max-time 40 https://registry.npmjs.org/playwright-core/-/playwright-core-1.62.0.tgz -o "$RUNNER_TEMP/playwright.tgz"
          test "$(openssl dgst -sha512 -binary "$RUNNER_TEMP/playwright.tgz" | openssl base64 -A)" == 'nsNRyq0r2zsG8AcRHWknc9QRA5XCueC7gWMrs+Gx2tlZn9hcl8zudfh00lhJPY1DE7NmZ6bDsT9g2yey8mXljA=='
          mkdir "$RUNNER_TEMP/playwright" "$RUNNER_TEMP/volume" "$RUNNER_TEMP/install"
          tar -xzf "$RUNNER_TEMP/playwright.tgz" --strip-components=1 -C "$RUNNER_TEMP/playwright"
          volume="$RUNNER_TEMP/volume"
          dmg="$RUNNER_TEMP/ztapi-dmg/ZTAPI-Workbench-macOS-$ARCH.dmg"
          target="$RUNNER_TEMP/install/ZTAPI Workbench Beta.app"
          hdiutil attach -quiet -readonly -nobrowse -mountpoint "$volume" "$dmg"
          trap 'hdiutil detach -quiet "$volume"' EXIT
          ditto "$volume/ZTAPI Workbench Beta.app" "$target"
          codesign --verify --deep --strict "$target"
          node tests/qa/darwin-installed-client.mjs "$target" "$RUNNER_TEMP/playwright"
