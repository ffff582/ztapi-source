server {
    listen 443 ssl;
    http2 on;
    server_name admin.ztapi.vip;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/admin;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    proxy_hide_header X-Request-ID;
    proxy_hide_header X-Oneapi-Request-Id;
    add_header X-Request-ID $ztapi_response_request_id always;
    add_header X-Oneapi-Request-Id $ztapi_response_request_id always;
    add_header X-ZTAPI-Source "https://github.com/ffff582/ztapi-source/tree/production-__ZTAPI_RELEASE_COMMIT__" always;
    add_header Link "<https://ztapi.vip/.well-known/source>; rel=\"source\"" always;

    location = /.well-known/source {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Oneapi-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/user/login {
        return 404;
    }

    location = /api/user/register {
        return 404;
    }

    location = /api/user/logout {
        return 404;
    }

    location = /api/auth/login {
        limit_req zone=admin_login burst=3 nodelay;
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Oneapi-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/register {
        return 404;
    }

    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Oneapi-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # The administration bundle may retain the same asset name across builds.
    # Revalidate it on every page load so a deployment cannot leave operators
    # running stale authentication or authorization code.
    location = /index.html {
        expires -1;
    }

    location ^~ /static/ {
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
