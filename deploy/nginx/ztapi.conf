limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=public_auth:10m rate=10r/m;

map $upstream_http_x_request_id $ztapi_response_request_id {
    default $upstream_http_x_request_id;
    "" $request_id;
}

server {
    listen 80;
    server_name ztapi.vip www.ztapi.vip admin.ztapi.vip;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ztapi.vip www.ztapi.vip;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/public;
    index index.html;
    client_max_body_size 32m;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    proxy_hide_header X-Request-ID;
    proxy_hide_header X-Oneapi-Request-Id;
    add_header X-Request-ID $ztapi_response_request_id always;
    add_header X-Oneapi-Request-Id $ztapi_response_request_id always;
    add_header X-ZTAPI-Source "https://github.com/ffff582/ztapi-source/tree/production-__ZTAPI_RELEASE_COMMIT__" always;
    add_header Link "<https://ztapi.vip/.well-known/source>; rel=\"source\"" always;

    location = /.well-known/source {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Oneapi-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/status {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Oneapi-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/user/login {
        return 404;
    }

    location = /api/user/register {
        return 404;
    }

    location = /api/user/logout {
        return 404;
    }

    location ^~ /api/admin/ {
        return 404;
    }

    location ^~ /api/channel/ {
        return 404;
    }

    location ^~ /api/models/ztapi/ {
        return 404;
    }

    location = /api/stripe/webhook {
        return 404;
    }

    location = /api/creem/webhook {
        return 404;
    }

    location = /api/waffo/webhook {
        return 404;
    }

    location ^~ /api/waffo-pancake/webhook/ {
        return 404;
    }

    location = /api/user/epay/notify {
        return 404;
    }

    location = /api/user/topup {
        return 404;
    }

    location = /api/user/pay {
        return 404;
    }

    location = /api/user/amount {
        return 404;
    }

    location = /api/user/stripe/pay {
        return 404;
    }

    location = /api/user/stripe/amount {
        return 404;
    }

    location = /api/user/creem/pay {
        return 404;
    }

    location = /api/user/waffo/amount {
        return 404;
    }

    location = /api/user/waffo/pay {
        return 404;
    }

    location = /api/user/waffo-pancake/amount {
        return 404;
    }

    location = /api/user/waffo-pancake/pay {
        return 404;
    }

    location = /api/subscription/balance/pay {
        return 404;
    }

    location = /api/subscription/epay/pay {
        return 404;
    }

    location = /api/subscription/stripe/pay {
        return 404;
    }

    location = /api/subscription/creem/pay {
        return 404;
    }

    location = /api/subscription/waffo-pancake/pay {
        return 404;
    }

    location = /api/subscription/epay/notify {
        return 404;
    }

    location = /api/subscription/epay/return {
        return 404;
    }

    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Oneapi-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /v1 {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Oneapi-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /v1/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Oneapi-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /v1beta {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Oneapi-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /v1beta/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Oneapi-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

