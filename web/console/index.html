<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/brand/ztapi-favicon.png" />
    <title>ZTAPI</title>
  </head>
  <body>
    <!-- ZTAPI_MAINTENANCE_NOTICE_START -->
    <style>
      body:has(.public-home) { --ztapi-notice-height: 72px; }
      #ztapi-maintenance-notice {
        display: none;
        position: fixed;
        inset: var(--header-h, 80px) 0 auto;
        z-index: 45;
        height: var(--ztapi-notice-height);
        box-sizing: border-box;
        border-top: 1px solid #634c36;
        border-bottom: 1px solid #795537;
        background: #29221c;
        color: #f6e8d8;
        font-size: 14px;
        line-height: 1.6;
        letter-spacing: 0;
      }
      body:has(.public-home) #ztapi-maintenance-notice { display: block; }
      .ztapi-notice-inner {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-content: center;
        align-items: center;
        column-gap: 24px;
        height: 100%;
        max-width: 1360px;
        box-sizing: border-box;
        margin: 0 auto;
        padding: 10px 32px;
      }
      .ztapi-notice-title { color: #ffc68a; white-space: nowrap; }
      .ztapi-notice-copy p { margin: 0; overflow-wrap: anywhere; }
      .ztapi-notice-copy time { color: #ffd5a5; font-weight: 700; }
      body:has(#ztapi-maintenance-notice) .public-home .gateway-hero {
        padding-top: calc(var(--header-h, 80px) + var(--ztapi-notice-height) + 56px);
      }
      @media (max-width: 760px) {
        body:has(.public-home) { --ztapi-notice-height: 136px; }
        #ztapi-maintenance-notice { font-size: 13px; }
        .ztapi-notice-inner { grid-template-columns: minmax(0, 1fr); gap: 4px; padding: 12px 20px; }
      }
    </style>
    <aside id="ztapi-maintenance-notice" role="status" aria-label="服务维护公告">
      <div class="ztapi-notice-inner">
        <strong class="ztapi-notice-title">服务维护公告</strong>
        <div class="ztapi-notice-copy">
          <p>部分模型调用暂受影响，我们正在进行维护处理。感谢您的理解与耐心等待。</p>
          <p>维护延长，恢复时间另行通知。完成验证后将更新公告。</p>
        </div>
      </div>
    </aside>
    <!-- ZTAPI_MAINTENANCE_NOTICE_END -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
